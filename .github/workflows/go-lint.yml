name: go | Linter

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/go-lint.yml'
      - '.golangci.yml'
      - '**/*.go'

permissions:
  contents: read
  pull-requests: write  # Needed for "only-new-issues" and commenting on PR
  issues: write  # Needed for commenting on PR

jobs:
  golint:
    name: '✨ Run golangci-lint'
    # Fork: longer budget than upstream's 60 min; package loading alone takes
    # ~15 min cold. Self-hosted ubuntu-xlarge (shared ARM64 org pool) has no
    # more memory than this runner, so it does not help (2026-10).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check Out  
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Get full history for full merge-base detection
      
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true
          go-version: stable

      # Fork: when a PR merges upstream commits that are not on the base branch,
      # compare against the newest upstream commit it contains, so the check
      # covers what the fork changed rather than all of upstream's code.
      # The `ci:full-scope` label (or an upstream fetch failure) keeps the PR
      # base, i.e. every package the PR touches.
      - name: Resolve comparison baseline
        id: baseline
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FULL_SCOPE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-scope') }}
        run: |
          base="${PR_BASE:-origin/main}"
          if [ -n "$PR_BASE" ] && [ "$FULL_SCOPE" != true ] && git fetch --quiet --no-tags \
              https://github.com/deploymenttheory/terraform-provider-microsoft365.git main; then
            upstream="$(git merge-base HEAD FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$upstream" "$PR_BASE"; then
              echo "PR merges upstream commits not on the base branch; comparing against upstream ${upstream}"
              base="$upstream"
            fi
          fi
          echo "Comparison baseline: ${base}"
          echo "base-ref=${base}" >> "$GITHUB_OUTPUT"

      - name: Detect changed Go packages
        id: changes
        env:
          BASE_REF: ${{ steps.baseline.outputs.base-ref }}
        run: python3 scripts/pipeline/pr/steps/detect_changes.py --base-ref "$BASE_REF"

      # Fork: lint only the changed packages, reporting findings on lines changed
      # since the baseline. The action's only-new-issues mode downloads the PR
      # patch, which GitHub refuses for diffs over 300 files.
      - name: Run golangci-lint
        if: steps.changes.outputs.has-changes == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: >-
            --timeout=180m --verbose --config=./.golangci.yml --issues-exit-code=1
            --fix=false --new=false --new-from-merge-base= --whole-files=false
            --new-from-rev=${{ steps.baseline.outputs.base-ref }}
            ${{ steps.changes.outputs.packages-args }}
          only-new-issues: false
          skip-cache: false              # restore and save cache
          skip-save-cache: false         # allow saving any new cache
          cache-invalidation-interval: 7 # auto-invalidate (refresh) once per week
      
      # Save artifacts on failure
      - name: Save artifacts
        if: failure()
        run: |
          mkdir -p wr_actions
          echo ${{ github.repository_owner }} > wr_actions/ghowner.txt
          echo ${{ github.event.repository.name }} > wr_actions/ghrepo.txt
          echo ${{ github.event.pull_request.number }} > wr_actions/prnumber.txt
      
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: wr_actions
      
      # Comment on failure
      - name: Get run url
        if: failure()
        run: |
          echo "gha_url=https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}" >> $GITHUB_ENV
          
      - name: Send build failure comment
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '<b>Build failure</b> \n\n This pull request contains a build failure which needs addressed [here](${{ env.gha_url}}) .'
            })